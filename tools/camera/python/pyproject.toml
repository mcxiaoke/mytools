[project]
name = "face-camera"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mcxiaoke", email = "mcxiaoke@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
face-camera = "face_camera:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
