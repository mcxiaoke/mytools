<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="__FILELIST_BASE__/favicon.ico">
<title>FileList</title>
<link rel="stylesheet" href="__FILELIST_BASE__/static/pico.min.css">
<link rel="stylesheet" href="__FILELIST_BASE__/static/app.css?v=__FILELIST_VERSION__">
<style>
  [x-cloak] { display: none !important; }
</style>
<script>
  window.__FILELIST_CONFIG__ = {
    base: "__FILELIST_BASE__",
    uploadEnabled: __FILELIST_UPLOAD__,
    version: "__FILELIST_VERSION__",
    gitCommit: "__FILELIST_GIT_COMMIT__",
    buildTime: "__FILELIST_BUILD_TIME__"
  };
</script>
<script src="__FILELIST_BASE__/static/app.js?v=__FILELIST_VERSION__"></script>
<script defer src="__FILELIST_BASE__/static/alpine.min.js"></script>
</head>
<body x-data="filelistApp">
<div class="container">
  <!-- Header: Root Link + Search Bar + Font Scale Controller -->
  <header>
    <a class="back-link" href="__FILELIST_BASE__/" :href="base + '/'" id="homeLink" @click.prevent="navigate('')">&#128193; 根目录</a>
    
    <div class="search-bar">
      <input type="text"
             id="searchInput"
             placeholder="搜索文件或目录名..."
             autocomplete="off"
             x-model="searchQuery"
             @keydown.enter="doSearch()"
             @input.debounce.300ms="if(searchQuery.trim()) doSearch(); else if(searchMode) clearSearch();">
      <button class="clear"
              id="clearBtn"
              type="button"
              x-show="searchQuery.length > 0"
              @click="clearSearch()"
              title="清除搜索"
              style="display:none;"
              x-cloak>&#10005;</button>
      <button id="searchBtn" type="button" @click="doSearch()">搜索</button>
    </div>

    <div class="font-ctrl" title="字号调节（点击中间百分比恢复默认）">
      <button type="button" id="fontDec" @click="decZoom()" title="缩小字号">A-</button>
      <button type="button" id="fontReset" class="font-val" @click="resetZoom()" title="点击恢复默认字号 (100%)" x-text="Math.round(zoomScale * 100) + '%'">100%</button>
      <button type="button" id="fontInc" @click="incZoom()" title="放大字号">A+</button>
    </div>
  </header>

  <!-- Breadcrumb Navigation -->
  <div class="breadcrumb" id="breadcrumb">
    <template x-if="searchMode">
      <span class="cur" x-text="'搜索: ' + searchQuery"></span>
    </template>
    <template x-if="!searchMode">
      <span>
        <template x-for="(crumb, idx) in breadcrumbItems" :key="crumb.path">
          <span>
            <template x-if="idx > 0">
              <span class="sep">/</span>
            </template>
            <template x-if="crumb.isCur">
              <span class="cur" x-text="crumb.name"></span>
            </template>
            <template x-if="!crumb.isCur">
              <a :href="crumb.href" @click.prevent="navigate(crumb.path)" x-text="crumb.name"></a>
            </template>
          </span>
        </template>
      </span>
    </template>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="upload-btn"
              id="uploadBtn"
              type="button"
              x-show="uploadEnabled && path !== '' && !searchMode"
              :disabled="uploading"
              @click="triggerUpload()"
              title="上传文件到当前目录">
        &#128392; 上传文件
      </button>
      <span class="upload-status"
            id="uploadStatus"
            :class="uploadStatusClass"
            x-text="uploadStatus"
            x-show="uploadStatus"></span>
    </div>
    <div class="toolbar-right">
      <div class="view-ctrl" role="group" aria-label="视图模式切换">
        <button type="button"
                id="viewListBtn"
                class="view-btn"
                :class="{ 'active': viewMode === 'list' }"
                @click="setViewMode('list')"
                title="列表视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
        <button type="button"
                id="viewGridBtn"
                class="view-btn"
                :class="{ 'active': viewMode === 'grid' }"
                @click="setViewMode('grid')"
                title="网格视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
      <span id="itemCount" x-text="!loading && items.length > 0 ? (sortedItems.length + ' 项') : ''"></span>
    </div>
  </div>

  <!-- Hidden File Input for Upload -->
  <input type="file" id="uploadInput" multiple style="display:none;" @change="onFileInputChange($event)">

  <!-- Table Container / Drag-Drop Zone -->
  <div class="table-wrap"
       id="tableWrap"
       :class="{ 'drop-active': isDragOver }"
       @dragover.prevent="isDragOver = true"
       @dragleave.prevent="isDragOver = false"
       @drop.prevent="handleDrop($event)">

    <!-- Loading State -->
    <div class="loading" x-show="loading" x-cloak>
      <div class="spinner"></div>
      <div x-text="searchMode ? '搜索中...' : '加载中...'">加载中...</div>
    </div>

    <!-- Error State -->
    <div class="error" x-show="!loading && errorMsg" x-cloak>
      <div class="big">&#9888;</div>
      <div x-text="errorMsg"></div>
      <button class="retry-btn" type="button" @click="searchMode ? doSearch() : loadDir(path)">重试</button>
    </div>

    <!-- Empty State -->
    <div class="empty" x-show="!loading && !errorMsg && sortedItems.length === 0" x-cloak>
      <div class="big">&#128269;</div>
      <div x-text="searchMode ? '没有找到匹配的文件' : '此目录为空'">此目录为空</div>
    </div>

    <!-- Data Table -->
    <table x-show="!loading && !errorMsg && sortedItems.length > 0 && viewMode === 'list'">
      <thead>
        <tr>
          <th class="name-col" data-col="name" @click="toggleSort('name')">
            名称<span class="arrow" x-text="sortCol === 'name' ? (sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : ''"></span>
          </th>
          <th class="size-col" data-col="size" @click="toggleSort('size')">
            大小<span class="arrow" x-text="sortCol === 'size' ? (sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : ''"></span>
          </th>
          <th class="time-col" data-col="time" @click="toggleSort('time')">
            修改时间<span class="arrow" x-text="sortCol === 'time' ? (sortDir === 'asc' ? ' \u25B2' : ' \u25BC') : ''"></span>
          </th>
          <th class="actions-col">操作</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="item in sortedItems" :key="item.path">
          <tr>
            <td class="name">
              <template x-if="item.isDir">
                <a :href="dirHref(item.path)" @click.prevent="navigate(item.path)">
                  <span class="icon" x-text="getIcon(item)"></span>
                  <span class="name-text" x-html="highlight(item.name)"></span>
                </a>
              </template>
              <template x-if="!item.isDir">
                <a :href="fileHref(item.path, false)" target="_blank">
                  <span class="icon" x-text="getIcon(item)"></span>
                  <span class="name-text" x-html="highlight(item.name)"></span>
                </a>
              </template>
            </td>
            <td class="size" x-text="item.isDir ? '-' : fmtSize(item.size)"></td>
            <td class="time" x-text="fmtTime(item.modTime)"></td>
            <td class="actions">
              <template x-if="!item.isDir">
                <a :href="downloadHref(item)" title="下载">&#11015;</a>
              </template>
            </td>
          </tr>
        </template>
      </tbody>
    </table>

    <!-- Grid View -->
    <div class="grid-wrap" x-show="!loading && !errorMsg && sortedItems.length > 0 && viewMode === 'grid'" x-cloak>
      <template x-for="item in sortedItems" :key="item.path">
        <div class="grid-card" :class="{ 'is-dir': item.isDir, 'is-img': isImage(item) }">
          <!-- 1. Folder item: click to enter directory -->
          <template x-if="item.isDir">
            <a :href="dirHref(item.path)" @click.prevent="navigate(item.path)" class="grid-thumb folder-thumb" :title="item.name">
              <span class="grid-icon">&#128193;</span>
            </a>
          </template>

          <!-- 2. Image item: click to open full-screen lightbox -->
          <template x-if="isImage(item)">
            <div class="grid-thumb img-thumb" @click="openLightbox(item)" :title="'点击预览: ' + item.name">
              <img :src="rawHref(item.path)" :alt="item.name" loading="lazy" class="grid-img" />
            </div>
          </template>

          <!-- 3. Other file item: open in new tab -->
          <template x-if="!item.isDir && !isImage(item)">
            <a :href="fileHref(item.path, false)" target="_blank" class="grid-thumb file-thumb" :title="item.name">
              <span class="grid-icon" x-text="getIcon(item)"></span>
            </a>
          </template>

          <div class="grid-info">
            <div class="grid-name" :title="item.name">
              <template x-if="item.isDir">
                <a :href="dirHref(item.path)" @click.prevent="navigate(item.path)" x-html="highlight(item.name)"></a>
              </template>
              <template x-if="isImage(item)">
                <span class="grid-link" tabindex="0" @click="openLightbox(item)" @keydown.enter="openLightbox(item)" x-html="highlight(item.name)"></span>
              </template>
              <template x-if="!item.isDir && !isImage(item)">
                <a :href="fileHref(item.path, false)" target="_blank" x-html="highlight(item.name)"></a>
              </template>
            </div>
            <div class="grid-meta">
              <span class="grid-size" x-text="item.isDir ? '文件夹' : fmtSize(item.size)"></span>
              <template x-if="!item.isDir">
                <a :href="downloadHref(item)" class="grid-dl" title="下载">&#11015;</a>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <span>FileList v0.2.0</span>
    <span class="sep">·</span>
    <span class="commit" title="Git Commit Hash">__FILELIST_GIT_COMMIT__</span>
    <span class="sep">·</span>
    <span class="build-time">构建于 __FILELIST_BUILD_TIME__</span>
  </footer>

  <!-- Lightbox Fullscreen Image Preview -->
  <div class="lightbox-overlay"
       id="lightboxOverlay"
       x-show="activeImg"
       x-cloak
       @keydown.window.escape="closeLightbox()"
       @keydown.window.left="prevImg()"
       @keydown.window.right="nextImg()"
       @click="closeLightbox()">
    
    <div class="lightbox-main">
      <!-- Top header bar: Title + Counter + Actions + Close button -->
      <div class="lightbox-header" @click.stop>
        <div class="lightbox-title-box">
          <span class="lightbox-filename" x-text="activeImg ? activeImg.name : ''"></span>
          <span class="lightbox-counter" x-show="currentImages.length > 0" x-text="(activeImgIndex + 1) + ' / ' + currentImages.length"></span>
        </div>
        <div class="lightbox-actions">
          <a class="lightbox-btn" :href="activeImg ? fileHref(activeImg.path, true) : '#'" title="下载原图">&#11015;</a>
          <a class="lightbox-btn" :href="activeImg ? fileHref(activeImg.path, false) : '#'" target="_blank" title="新标签页打开">&#8599;</a>
          <button type="button" class="lightbox-btn close" @click="closeLightbox()" title="关闭 (Esc)">&#10005;</button>
        </div>
      </div>

      <!-- Image display container with Nav Arrows -->
      <div class="lightbox-body" @click="closeLightbox()">
        <button type="button"
                id="lightboxPrev"
                class="lightbox-nav prev"
                x-show="currentImages.length > 1"
                @click.stop="prevImg()"
                title="上一张 (←)">&#10094;</button>
        
        <div class="lightbox-img-wrap" @click="closeLightbox()">
          <img :src="activeImg ? rawHref(activeImg.path) : ''"
               :alt="activeImg ? activeImg.name : ''"
               class="lightbox-img"
               @click.stop />
        </div>

        <button type="button"
                id="lightboxNext"
                class="lightbox-nav next"
                x-show="currentImages.length > 1"
                @click.stop="nextImg()"
                title="下一张 (→)">&#10095;</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
