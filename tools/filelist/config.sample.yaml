# FileList Configuration Sample
# Copy this file to config.yaml and edit as needed.
# All fields below show their default values.
#
# ── File Locations ──────────────────────────────────────────────
# dataDir       Runtime data directory (index cache, etc.)
# log.file      Log file path (empty = stdout)
# index.persist Index cache file (empty = auto: <dataDir>/filelist.idx)
# ───────────────────────────────────────────────────────────────

server:
  host: 0.0.0.0          # listen address (0.0.0.0 = all interfaces)
  port: 8080             # HTTP port
  # basePath: ""         # sub-directory deployment behind a reverse proxy.
                         #   Example: basePath: /files  -> site lives at
                         #   https://host/files/ and proxy strips the prefix.
                         #   Leave empty when served at the domain root.
  # token: ""            # optional access token. Empty = open access.
                         #   When set, visitors authenticate once via
                         #   ?token=xxx (or Authorization: Bearer xxx); a
                         #   cookie is then set for the session. In a browser
                         #   just append ?token=xxx to the URL on first visit.

log:
  level: info            # log level: debug | info | warn | error
  file: ""               # log file path (empty = stdout; ~ is expanded to home)
                         #   example: /var/log/filelist.log
                         #   example: ~/filelist.log
                         #   NOTE: the log file grows without bound; rotate it
                         #   externally (e.g. logrotate) on long-running hosts.

dataDir: ./data          # runtime data directory (index cache, etc.)
                         #   created automatically on startup
                         #   ~ is expanded to home directory

index:
  interval: 5m           # re-index interval (30s, 5m, 1h, etc.)
  persist: ""            # index cache file (empty = auto: <dataDir>/filelist.idx)
                         #   set explicitly to override; ~ is expanded
  maxDepth: 0            # max directory walk depth (0 = unlimited; 1 = only the
                         #   entries directly under each root)
  # incremental: true    # true (default): diff against the previous pass —
                         #   directories whose mtime/size are unchanged are
                         #   skipped entirely, so an idle tree costs ~one stat
                         #   per root. false: always rebuild the full index.
                         #   Note: content edits that do not change a file's
                         #   mtime/size are only picked up when its parent
                         #   directory changes; set false for strict freshness.
  excludeDirs:           # directory names to skip during indexing and listing
                         #   (case-insensitive; * and ? wildcards supported)
    - .git
    - node_modules
    - __pycache__
    - $RECYCLE.BIN
    - System Volume Information
  excludeFiles:          # file name patterns to skip during indexing/listing
                         #   (case-insensitive glob; empty list disables)
                         #   Defaults (used when the key is absent):
    - .env
    - .env.*
    - .htpasswd
    - .htaccess
    - id_rsa
    - id_rsa.*
    - id_ed25519
    - id_ed25519.*
    - '*.pem'
    - '*.key'
    - '*.pfx'
    - '*.p12'
    - .DS_Store
    - Thumbs.db

# Security knobs. Sensible defaults are shown; for a home LAN you can leave
# this whole section out.
security:
  # allowOutsideSymlinks: false
  #   false (default): /raw refuses files that resolve through a symlink to a
  #   location outside the configured root (e.g. a link to /etc or another
  #   disk). true: allow such links (for setups that intentionally publish
  #   symlinked content). Symlinks are never followed while indexing.
  # blockInlineHTML: true
  #   true (default): .html/.htm/.svg/.xhtml files are always sent as
  #   downloads instead of rendering inline — a shared HTML file must not run
  #   scripts in this site's own origin. false: let the browser render them.

# Upload settings. Disabled by default for read-only safety.
upload:
  enabled: false         # true: allow uploading files to directories
                         # Uploading is only permitted inside concrete subdirectories
                         # (not the root catalog view). Filename conflicts are
                         # automatically suffixed with numbers, e.g. file (1).txt.

# Management & File Operations (mkdir, text editing, rename, safe deletion)
# Disabled by default for read-only safety.
manage:
  enabled: false         # master switch for management features
  allowEdit: true        # true: allow online viewing & editing of text files (Ctrl+S, atomic save)
  allowMkdir: true       # true: allow creating new subdirectories
  allowRename: true      # true: allow renaming files and folders
  allowDelete: false     # true: allow deleting files and folders (requires non-empty deleteToken!)
  deleteToken: ""        # independent token for deletion. When configured, deleting any file or
                         # folder requires typing this secret token in the confirmation dialog.
                         # If left empty, delete operations remain hard-locked on the server.

# ── Ops Panel ──────────────────────────────────────────────────
# An optional browser-driven command runner. Two execution modes:
#   - "命令" (one-shot exec): pipes, clean output, real exit code
#   - "终端" (interactive PTY): a real shell, Unix only
#
# ⚠️  SECURITY: this is the highest-risk feature in the project. With a
#     root deployment the interactive terminal is a full root shell
#     reachable from a browser. It is OFF by default and fails closed.
#
# Two conditions must BOTH hold before the panel is registered at all:
#   1. ops.enabled: true
#   2. server.token is non-empty
# If you set enabled without a token, the panel stays disabled and a
# warning is logged at startup. This is deliberate: the WebSocket
# handshake needs a credential to check, and without one the panel
# would be an unauthenticated command runner.
ops:
  enabled: false           # master switch (see the two conditions above)
  mode: allowlist          # allowlist (default, recommended) | free (arbitrary commands)
  terminalToken: ""        # second factor for the interactive terminal. Empty disables
                           # the terminal entirely. Use a DIFFERENT secret from server.token:
                           # one-shot commands are bounded by the allowlist, a shell is not.
  cwdRoots: []             # allowed working-directory roots (empty = reuse roots[].path)
  originPatterns: []       # WebSocket Origin allowlist (empty = derive from request Host).
                           # REQUIRED when behind a reverse proxy whose Host differs from
                           # the browser's Origin. This check is the only defence against
                           # cross-site WebSocket hijacking, because the session cookie is
                           # SameSite=Lax and Lax does not block a WS handshake.
  timeout: 30s             # per-command timeout (SIGTERM, then SIGKILL to the process group)
  maxOutput: 1MB           # per-session output cap; excess is dropped and flagged
  maxSessions: 2           # concurrent session cap
  idleTimeout: 30m         # idle sessions are reaped
  scrollbackBytes: 256KB   # replay buffer for reconnects

  # Extra allow patterns, APPENDED to a built-in read-only set. The
  # built-in set already covers ls/cat/head/tail/wc/stat/file/du/df/
  # grep/rg/find/ps/uptime/free/uname/hostname/whoami/id/date/ss/netstat/
  # ip/systemctl(status|is-active|...)/journalctl/docker(ps|logs|...)/git
  # (status|log|diff|...), so most read-only inspection works out of the
  # box. Add only what you need beyond that.
  #
  # Note: pagers and interactive tools (less, more, top, vi) are
  # deliberately NOT in the built-in set — they block waiting for input
  # and belong in the terminal mode instead.
  allow:
    # - '^systemctl (restart|reload|start|stop) [\w@.\-]+$'
    # - '^docker compose (up|down|restart)( [\w\-]+)*$'
    # - '^nginx -t$'

  # Global deny list. An EMPTY LIST (deny: []) clears the built-in
  # dangerous set, matching how index.excludeFiles behaves. The
  # built-in set covers rm, mkfs, dd, chmod, chown, mount, useradd,
  # passwd, shutdown, reboot, iptables, crontab, package managers and
  # writes to raw block devices. Deny always wins over allow, in every
  # mode.
  deny: []

# Path mappings: URL path -> real disk path
# - URL: virtual web path shown in browser (must start with /)
# - Path: real disk path (use forward slashes for cross-platform)
# - ~ is expanded to home directory
# - Root "/" is NOT allowed; all roots must be subpaths like /data, /downloads.
#   The URL "/" is reserved for the roots listing page.
# - A relative path resolves against THIS file's directory. If the config sits
#   in a system location (e.g. /etc/filelist), an explicit absolute path is
#   required — otherwise you would publish the config directory itself.
roots:
  # Linux examples:
  # - url: /data
  #   path: /mnt/data
  # - url: /media
  #   path: /media
  # - url: /usb
  #   path: /mnt/usb

  # Windows examples:
  # - url: /c
  #   path: C:/
  # - url: /downloads
  #   path: C:/Users/username/Downloads

  - url: /files
    path: ./
