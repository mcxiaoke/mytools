HelpMain = """saferm — a safe rm that moves instead of deletes

Usage:
  saferm [options] <path>...     Move paths into the same-volume trash root
  saferm where                   Show the effective config and trash roots of all volumes (read-only, creates nothing)
  saferm version                 Show version

Options:
  -n, --dry-run               Only show where things would be moved; nothing is written or created
  -y, --yes                   Skip "confirmation-level" prompts (guardrails and danger level still apply)
  -f, --force                 Missing paths are not an error; also skips "confirmation-level" prompts
  -i, --interactive           Force confirmation (overrides -y / -f)
      --yes-i-am-sure         Skip "danger-level" confirmation (the only switch; deliberately long)
      --allow-dangerous       Bypass the dangerous-path guardrails (must be given explicitly)
      --literal               Treat operands as literal paths; do not expand globs
      --config <file>         Specify the config file
      --trash-root <dir>      Override the trash root (for this run only)
  -r, -R                      Accepted and ignored (recursive descent is already the default)
      --preserve-root         Accepted and ignored (volume-root protection is always on and cannot be disabled)
  -v, --verbose               Print details for every target
  -h, --help                  Show help
  -V, --version               Show version

Safety boundaries (default behavior; -f cannot remove them):
  · Refuses to remove: volume roots, the current directory and its ancestors, critical system directories, VCS repository roots, the trash root itself
  · Refuses cross-volume moves: the trash root must be on the same volume as the target; no "copy+delete" fallback
  · Does not follow symlinks or junctions: the link itself is what gets moved
  · Large directories / a target that is itself a repository root → danger level; you must type the target name to confirm (-y has no effect)
  · Non-interactive environments (pipes, CI) are refused by default; pass --yes or --yes-i-am-sure explicitly
  · Any failure means "original data untouched"; never degrades to permanent deletion

Manual restore: move the contents of the corresponding operation directory back to the root of its volume,
          the directory structure is preserved as-is. See docs/saferm-design.md for details.
"""
HelpWhere = """saferm where — show the effective config and the trash roots of all volumes

Usage:
  saferm where [options]

Options:
      --config <file>         Specify the config file
  -h, --help                  Show help

Read-only: creates no directories, writes no markers, moves nothing.
Exit code 1 if some volume is unusable or an operation did not finish cleanly; useful for scripts.
"""
